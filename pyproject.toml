[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shotquill"
dynamic = ["version"]
description = "Cross-platform screenshot & annotation tool (macOS first)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "wardmos" }]
keywords = ["screenshot", "annotation", "macos", "linux", "windows", "cli", "mcp", "qt", "pyside6"]
classifiers = [
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Utilities",
]

dependencies = [
    "PySide6>=6.6",
    "pynput>=1.7",
    # X11 window enumeration (squill windows, smart-capture highlight, blocklist
    # redaction). Already pulled in transitively by pynput's X11 backend, named
    # explicitly here because shotquill imports it directly.
    "python-xlib>=0.33 ; sys_platform == 'linux'",
    "pyobjc-framework-Cocoa>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10.0 ; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/wardmos/shotquill"
Repository = "https://github.com/wardmos/shotquill"
Issues = "https://github.com/wardmos/shotquill/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff==0.16.0",
]
# On-device OCR on Windows via the WinRT Windows.Media.Ocr engine. Optional and
# Windows-only — the engine itself ships with Windows, these are just the Python
# projections that call it. Off Windows the markers make this an empty install.
windows-ocr = [
    "winrt-Windows.Media.Ocr>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0 ; sys_platform == 'win32'",
]

[project.scripts]
shotquill = "shotquill.cli:main"
squill = "shotquill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "shotquill.__version__" }

# Desktop integration on Linux: pipx / pip lay these under ``<prefix>/share/...``
# (``~/.local/share`` for ``pipx install``, ``/usr/share`` for a system install).
# Both paths are on XDG_DATA_DIRS by default, so GNOME / KDE / XFCE pick up the
# launcher entry in the app menu and the icon theme resolves ``Icon=shotquill``
# to the SVG. The macOS and AppImage paths ignore these files (the AppImage
# bundles its own ``packaging/linux/shotquill.desktop`` separately).
[tool.setuptools.data-files]
"share/applications" = ["packaging/linux/shotquill-gui.desktop"]
"share/icons/hicolor/scalable/apps" = [
    "packaging/linux/icons/hicolor/scalable/apps/shotquill.svg",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Coverage is opt-in (run ``pytest --cov``) so the default test run and every CI
# matrix leg stay fast; the dedicated ``coverage`` CI job passes the flags. These
# sections only configure *how* coverage measures when asked.
[tool.coverage.run]
source = ["shotquill"]
branch = true

[tool.coverage.report]
show_missing = true
# Platform backends guard their OS-only calls with ``# pragma: no cover`` (AppKit,
# WinRT, the live X/Wayland paths) since no single CI OS exercises all of them;
# the default already drops those lines plus the type-checking-only imports.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
