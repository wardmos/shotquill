name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint / format are interpreter-version-independent, so run them once on a
  # single runner instead of redundantly on every matrix leg. Just the pinned
  # ruff — no PySide6 install — keeps this leg fast.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        # Pin kept in lockstep with pyproject's dev extra so local and CI agree.
        run: pip install ruff==0.15.15
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Format check (ruff)
        run: ruff format --check src tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Interpreter-version risk is overwhelmingly caught on Linux (the full
        # 3.10-3.13 sweep), so the costly runners — macOS bills at 10x, Windows
        # at 2x — only cover the floor and ceiling (oldest + newest), where
        # version-specific breakage actually lands. Linux keeps the full sweep.
        exclude:
          - os: macos-14
            python-version: "3.11"
          - os: macos-14
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            packaging/constraints-release.txt
      - name: Install Qt system libraries (Linux, for headless PySide6)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 libgl1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - name: Install dependencies
        # uv reuses its warm cache (hardlinks on macOS/Linux); the test matrix
        # deliberately resolves the loose pyproject bounds, not the release pins.
        # (Even cold, uv resolves+installs far faster than pip here.)
        run: uv pip install --system -e ".[dev]"
      - name: Test (Linux, headless via Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -q
      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: pytest -q
      - name: Test (Windows, headless via offscreen)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  # Single aggregated gate so branch protection only needs one required check,
  # regardless of how the lint job or test matrix above change. Fails if either
  # the lint job or any matrix leg did.
  ci-success:
    name: CI success
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify lint and all matrix jobs passed
        if: needs.lint.result != 'success' || needs.test.result != 'success'
        run: exit 1
