name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint / format are interpreter-version-independent, so run them once on a
  # single runner instead of redundantly on every matrix leg. Just the pinned
  # ruff — no PySide6 install — keeps this leg fast.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        # Pin kept in lockstep with pyproject's dev extra so local and CI agree.
        run: pip install ruff==0.15.17
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Format check (ruff)
        run: ruff format --check src tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Interpreter-version risk is overwhelmingly caught on Linux (the full
        # 3.10-3.13 sweep), so the costly runners — macOS bills at 10x, Windows
        # at 2x — only cover the floor and ceiling (oldest + newest), where
        # version-specific breakage actually lands. Linux keeps the full sweep.
        exclude:
          - os: macos-14
            python-version: "3.11"
          - os: macos-14
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt system libraries (Linux, for headless PySide6)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 libgl1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test (Linux, headless via Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -q
      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: pytest -q
      - name: Test (Windows, headless via offscreen)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  # Coverage runs once, on Linux, since no single OS exercises every platform
  # backend — the cross-OS lines are excluded via ``# pragma: no cover`` rather
  # than counted as missed. A conservative floor guards against a large drop
  # without flaking on the few percent that move between interpreter versions.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt system libraries (for headless PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 libgl1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test with coverage
        run: xvfb-run -a pytest -q --cov --cov-report=term-missing --cov-fail-under=85

  # Single aggregated gate so branch protection only needs one required check,
  # regardless of how the lint job or test matrix above change. Fails if the
  # lint job, any matrix leg, or the coverage job did.
  ci-success:
    name: CI success
    if: always()
    needs: [lint, test, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Verify lint and all matrix jobs passed
        if: needs.lint.result != 'success' || needs.test.result != 'success' || needs.coverage.result != 'success'
        run: exit 1
