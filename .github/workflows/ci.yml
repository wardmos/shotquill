name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt system libraries (Linux, for headless PySide6)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 libgl1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        if: runner.os == 'Linux'
        run: ruff check src tests
      - name: Format check (ruff)
        if: runner.os == 'Linux'
        run: ruff format --check src tests
      - name: Test (Linux, headless via Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -q
      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: pytest -q
      - name: Test (Windows, headless via offscreen)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  # Single aggregated gate so branch protection only needs one required check,
  # regardless of how the test matrix above changes. Fails if any matrix leg did.
  ci-success:
    name: CI success
    if: always()
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix jobs passed
        if: needs.lint-and-test.result != 'success'
        run: exit 1
