name: Package smoke

# Validates that the macOS bundle/DMG still builds, without cutting a release.
# Runs on PRs that touch packaging, and on demand.
on:
  pull_request:
    paths:
      # The PyInstaller bundle imports the application source, so src changes
      # (hidden imports, resources, bundle metadata) can break packaging too.
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # Same pins as the release workflow, so the smoke build exercises the
        # exact environment a release would ship with.
        run: |
          python -m pip install --upgrade pip
          pip install -c packaging/constraints-release.txt -e . pyinstaller
      - name: Record build dependency versions
        run: |
          {
            echo "### Build dependency versions"
            echo '```'
            pip freeze | grep -iE '^(pyinstaller|pyside6|shiboken6|pyobjc)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build .app + DMG (smoke)
        # universal2 only: it needs universal2 wheels for every binary dep, so
        # it is the strictest of the three arches — the thinned arm64/x86_64
        # release slices can't fail independently of it. UDZO because the smoke
        # DMG is a 7-day throwaway artifact; zlib compresses much faster than
        # the LZMA default releases ship with.
        env:
          SHOTQUILL_DMG_FORMAT: UDZO
        run: bash packaging/macos/build_dmg.sh v0.0.0-smoke universal2
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: shotquill-dmg-smoke
          path: dist/ShotQuill-*.dmg
          if-no-files-found: error
          retention-days: 7
