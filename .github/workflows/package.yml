name: Package smoke

# Validates that the macOS bundle/DMG still builds, without cutting a release.
# Runs on PRs that touch packaging, and on demand.
on:
  pull_request:
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - name: Build .app + DMG (smoke)
        run: bash packaging/macos/build_dmg.sh v0.0.0-smoke
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: shotquill-dmg-smoke
          path: dist/ShotQuill-*.dmg
          if-no-files-found: error
          retention-days: 7
