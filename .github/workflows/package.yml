name: Package smoke

# Validates that the macOS bundle/PKG and the Linux AppImage still build,
# without cutting a release. Runs on PRs that touch packaging, on pushes to
# main (so post-merge main always has a built-from-main smoke artifact, even
# if a PR slipped through without triggering this), and on demand.
on:
  push:
    branches: [main]
    paths:
      # Same packaging-relevant paths as the PR trigger below.
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/package.yml"
  pull_request:
    paths:
      # The PyInstaller bundle imports the application source, so src changes
      # (hidden imports, resources, bundle metadata) can break packaging too.
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        # Same pins as the release workflow, so the smoke build exercises the
        # exact environment a release would ship with. uv installs from its
        # global cache via hardlinks, so the large PySide6 wheel isn't
        # re-extracted every run (much faster than pip).
        run: uv pip install --system -c packaging/constraints-release.txt -e . pyinstaller
      - name: Record build dependency versions
        run: |
          {
            echo "### Build dependency versions"
            echo '```'
            pip freeze | grep -iE '^(pyinstaller|pyside6|shiboken6|pyobjc)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve smoke artifact version
        id: smoke
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          short_sha="${SOURCE_SHA:0:7}"
          product_version="$(python -c 'import shotquill; print(shotquill.__version__)')"
          version="v$product_version"
          artifact_suffix="-$short_sha"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_suffix=$artifact_suffix" >> "$GITHUB_OUTPUT"
      - name: Build .app + PKG (smoke)
        # universal2 only: it needs universal2 wheels for every binary dep, so
        # it is the strictest of the three arches — the thinned arm64/x86_64
        # release slices can't fail independently of it.
        env:
          # Repository-wide and monotonic across smoke and release workflows.
          SHOTQUILL_BUILD_VERSION: ${{ github.run_id }}
        run: bash packaging/macos/build_pkg.sh "${{ steps.smoke.outputs.version }}" universal2
      - name: Exercise universal2 PKG install and uninstall
        run: bash packaging/macos/smoke_pkg.sh dist/ShotQuill-*-universal2.pkg
      - name: Validate generated Homebrew cask
        run: |
          arm_sha="$(printf 'a%.0s' {1..64})"
          intel_sha="$(printf 'b%.0s' {1..64})"
          bash packaging/macos/smoke_cask.sh v0.0.0 "$arm_sha" "$intel_sha"
      - name: Upload PKG artifact
        uses: actions/upload-artifact@v7
        with:
          name: shotquill-pkg-smoke${{ steps.smoke.outputs.artifact_suffix }}
          path: dist/ShotQuill-*.pkg
          if-no-files-found: error
          retention-days: 7

  build-linux:
    # Mirrors the release build-linux job (same runner, pins, and smoke test)
    # so an AppImage breakage surfaces on the PR instead of at tag time.
    # ubuntu-22.04 keeps the glibc floor at 2.35, same as releases ship with.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        # Same pins as the release workflow, so the smoke build exercises the
        # exact environment a release would ship with. uv installs from its
        # global cache via hardlinks, so the large PySide6 wheel isn't
        # re-extracted every run (much faster than pip).
        run: uv pip install --system -c packaging/constraints-release.txt -e . pyinstaller
      - name: Record build dependency versions
        run: |
          {
            echo "### Build dependency versions"
            echo '```'
            pip freeze | grep -iE '^(pyinstaller|pyside6|shiboken6)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve smoke artifact version
        id: smoke
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          short_sha="${SOURCE_SHA:0:7}"
          version="v0.0.0-smoke-$short_sha"
          artifact_suffix="-$short_sha"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_suffix=$artifact_suffix" >> "$GITHUB_OUTPUT"
      - name: Build AppImage (smoke)
        run: bash packaging/linux/build_appimage.sh "${{ steps.smoke.outputs.version }}"
      - name: Install Qt runtime system libraries
        # The AppImage deliberately doesn't bundle the EGL/GL stack (Mesa) —
        # every desktop distro ships it with the graphical session. The bare
        # server runner has no GUI stack at all, so install the same libs
        # ci.yml uses for headless PySide6 before launching the bundle.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxkbcommon0
      - name: Smoke-test the AppImage
        # Proves the bundle launches on a clean runner (Python + Qt load), so a
        # broken bundle fails the PR instead of the release.
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          img=$(echo dist/ShotQuill-*.AppImage)
          chmod +x "$img"
          "$img" --version
          QT_QPA_PLATFORM=offscreen "$img" doctor
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: shotquill-appimage-smoke${{ steps.smoke.outputs.artifact_suffix }}
          path: dist/ShotQuill-*.AppImage
          if-no-files-found: error
          retention-days: 7

  build-windows:
    # Builds the windowed GUI exe and the console CLI exe (sharing one payload),
    # then smoke-tests the CLI so a broken PyInstaller invocation (missing hidden
    # import, Qt prune gone wrong, UPX corruption) fails the PR instead of a release.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        # ``pillow`` is only needed to render the .ico; the build degrades to no
        # custom icon without it, but the smoke build folds it in to exercise
        # that path too.
        run: uv pip install --system -c packaging/constraints-release.txt -e . pyinstaller pillow
      - name: Install UPX
        # PyInstaller picks UPX up off PATH automatically (the spec excludes the
        # C runtime / Python core DLLs it would corrupt). Download the pinned
        # release straight from GitHub — faster than ``choco install`` and
        # reproducible: the exact UPX that compressed a bundle is fixed, not
        # "whatever the runner's Chocolatey feed currently has".
        shell: pwsh
        run: |
          $ver = '5.2.0'
          $url = "https://github.com/upx/upx/releases/download/v$ver/upx-$ver-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile upx.zip
          Expand-Archive -Path upx.zip -DestinationPath upx -Force
          "$PWD\upx\upx-$ver-win64" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Record build dependency versions
        shell: pwsh
        run: |
          "### Build dependency versions" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          pip freeze | Select-String -Pattern '^(pyinstaller|pyside6|shiboken6|pillow)' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Resolve smoke artifact version
        id: smoke
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $shortSha = $env:SOURCE_SHA.Substring(0, 7)
          $version = "v0.0.0-smoke-$shortSha"
          $artifactSuffix = "-$shortSha"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_suffix=$artifactSuffix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build GUI + CLI exes (smoke)
        shell: pwsh
        run: .\packaging\windows\build_exe.ps1 "${{ steps.smoke.outputs.version }}"
      - name: Smoke-test the CLI exe
        # Proves the frozen bundle launches (Python + Qt load) and the lazily
        # imported Windows backends resolve under PyInstaller.
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .\dist\shotquill\squill.exe --version
          .\dist\shotquill\squill.exe doctor
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: shotquill-windows-smoke${{ steps.smoke.outputs.artifact_suffix }}
          path: dist/shotquill/**
          if-no-files-found: error
          retention-days: 7
