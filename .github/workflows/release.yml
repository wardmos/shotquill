name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # workflow_dispatch can be launched from a branch in the Actions UI. Stop
  # before creating a release unless the selected ref is a PackageKit-safe tag.
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate release tag
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_REF_TYPE" != "tag" ] || [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: releases require a vX.Y.Z tag, got $RELEASE_REF_TYPE $RELEASE_TAG" >&2
            exit 2
          fi

  # Gate: never cut a release from a commit that fails the checks CI runs. A tag
  # can land on any commit, and workflow_dispatch could otherwise bypass a red CI
  # entirely. Split out of the macOS build so the platform builds (which all
  # `needs: gate`) run in parallel instead of chaining behind one another. Kept
  # on macOS so the gate exercises the same OS the .app is built on.
  gate:
    needs: validate-release
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c packaging/constraints-release.txt -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Format check (ruff)
        run: ruff format --check src tests
      - name: Test
        run: pytest -q

  # Create the GitHub Release once, so the parallel platform builds each upload
  # their own artifacts to it instead of racing to create it. Generating release
  # notes here keeps that work off the build jobs. Created as a DRAFT so the
  # ~25-min window before the binaries are attached isn't a public, empty
  # release; publish-release flips it live once every bundle is in.
  create-release:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create draft GitHub Release
        # Pinned to a commit SHA (supply-chain hardening); v3.0.0 (Node 24 runtime).
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          draft: true
          generate_release_notes: true

  build-macos:
    # The .app + per-arch PKGs. Runs in parallel with build-linux now that the
    # gate and the Release shell are their own jobs.
    needs: [gate, create-release]
    runs-on: macos-14
    timeout-minutes: 45
    outputs:
      arm_sha: ${{ steps.sha.outputs.arm_sha }}
      intel_sha: ${{ steps.sha.outputs.intel_sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        # Build deps are pinned so re-running this workflow on the same commit
        # reproduces the same bundle; upgrades go through that file in a PR. uv
        # installs from its global cache via hardlinks (much faster than pip).
        run: uv pip install --system -c packaging/constraints-release.txt -e ".[dev]" pyinstaller
      - name: Record build dependency versions
        run: |
          {
            echo "### Build dependency versions"
            echo '```'
            pip freeze | grep -iE '^(pyinstaller|pyside6|shiboken6|pyobjc)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build .app + PKGs (arm64, x86_64, universal2)
        env:
          # Keep release PKGs newer than any earlier smoke build of the same
          # product version, including builds installed through Homebrew.
          SHOTQUILL_BUILD_VERSION: ${{ github.run_id }}
        run: bash packaging/macos/build_pkg.sh "${{ github.ref_name }}"
      - name: Exercise universal2 PKG install and uninstall
        run: bash packaging/macos/smoke_pkg.sh dist/ShotQuill-*-universal2.pkg
      - name: Compute SHA256
        id: sha
        run: |
          cd dist
          # Sidecar checksum files (shasum -c compatible) shipped with the release.
          for pkg in ShotQuill-*.pkg; do
            shasum -a 256 "$pkg" > "$pkg.sha256"
          done
          echo "arm_sha=$(awk '{print $1}' ShotQuill-*-arm64.pkg.sha256)" >> "$GITHUB_OUTPUT"
          echo "intel_sha=$(awk '{print $1}' ShotQuill-*-x86_64.pkg.sha256)" >> "$GITHUB_OUTPUT"
      - name: Validate generated Homebrew cask
        run: |
          bash packaging/macos/smoke_cask.sh \
            "${{ github.ref_name }}" \
            "${{ steps.sha.outputs.arm_sha }}" \
            "${{ steps.sha.outputs.intel_sha }}"
      - name: Add PKGs to the release
        # Pinned to a commit SHA (supply-chain hardening); v3.0.0 (Node 24 runtime).
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          # Keep it a draft; publish-release flips it live once every bundle is in.
          draft: true
          files: |
            dist/ShotQuill-*.pkg
            dist/ShotQuill-*.pkg.sha256

  publish-pypi:
    # `pipx install shotquill` / `pip install shotquill` — the primary channel
    # for the CLI/MCP audience. The package is pure Python (one py3-none-any
    # wheel covers every OS; PySide6 and the macOS-only pyobjc deps resolve at
    # install time), so it builds anywhere; ubuntu is just the cheapest runner.
    needs: gate  # don't publish from a commit the gate rejected
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      # OIDC token for PyPI Trusted Publishing — no API token stored in repo
      # secrets. Configure the trusted publisher once on pypi.org (project
      # shotquill, this repo + workflow `release.yml`, environment `pypi`).
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata renders on PyPI
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - name: Publish to PyPI
        # Pinned to a commit SHA (supply-chain hardening); v1.14.0.
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          # A re-run of the release (same tag/version) shouldn't fail on the
          # immutable PyPI upload that already happened.
          skip-existing: true

  build-linux:
    # Single-file AppImage: the CLI/MCP in a box for users who don't want pip.
    # Built on ubuntu-22.04, so the glibc floor is 2.35 (Ubuntu 22.04+ /
    # Debian 12+) — an older floor needs an older build base (a container).
    # Runs in parallel with build-macos; the Release shell already exists.
    needs: [gate, create-release]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        # Same pinned build deps as the macOS bundle, for a reproducible build.
        # uv installs from its global cache via hardlinks (much faster than pip).
        run: uv pip install --system -c packaging/constraints-release.txt -e ".[dev]" pyinstaller
      - name: Build AppImage
        run: bash packaging/linux/build_appimage.sh "${{ github.ref_name }}"
      - name: Install Qt runtime system libraries
        # The AppImage deliberately doesn't bundle the EGL/GL stack (Mesa) —
        # every desktop distro ships it with the graphical session. The bare
        # server runner has no GUI stack at all, so install the same libs
        # ci.yml uses for headless PySide6 before launching the bundle.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxkbcommon0
      - name: Smoke-test the AppImage
        # Proves the bundle launches on a clean runner (Python + Qt load), so a
        # broken bundle fails the release instead of shipping.
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          img=$(echo dist/ShotQuill-*.AppImage)
          chmod +x "$img"
          "$img" --version
          QT_QPA_PLATFORM=offscreen "$img" doctor
      - name: Compute SHA256
        run: |
          cd dist
          for img in ShotQuill-*.AppImage; do
            sha256sum "$img" > "$img.sha256"
          done
      - name: Add AppImage to the release
        # Pinned to a commit SHA (supply-chain hardening); v3.0.0 (Node 24 runtime).
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          # Keep it a draft; publish-release flips it live once every bundle is in.
          draft: true
          files: |
            dist/ShotQuill-*.AppImage
            dist/ShotQuill-*.AppImage.sha256

  build-windows:
    # The GUI + CLI exes (sharing one payload), zipped into a single release
    # archive. Mirrors package.yml's build-windows smoke job — same spec, prune,
    # and smoke test — but attaches the bundle to the draft Release instead of a
    # throwaway artifact. Runs in parallel with build-macos / build-linux.
    needs: [gate, create-release]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        # Same pinned build deps as the macOS/Linux bundles, for a reproducible
        # build. ``pillow`` only renders the .ico (the build degrades without it).
        run: uv pip install --system -c packaging/constraints-release.txt -e . pyinstaller pillow
      - name: Install UPX
        # PyInstaller picks UPX up off PATH automatically (the spec excludes the
        # C runtime / Python core DLLs it would corrupt). Download the pinned
        # release straight from GitHub — faster than ``choco install`` and
        # reproducible: the exact UPX that compressed a bundle is fixed, not
        # "whatever the runner's Chocolatey feed currently has".
        shell: pwsh
        run: |
          $ver = '5.2.0'
          $url = "https://github.com/upx/upx/releases/download/v$ver/upx-$ver-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile upx.zip
          Expand-Archive -Path upx.zip -DestinationPath upx -Force
          "$PWD\upx\upx-$ver-win64" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Record build dependency versions
        shell: pwsh
        run: |
          "### Build dependency versions" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          pip freeze | Select-String -Pattern '^(pyinstaller|pyside6|shiboken6|pillow)' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Build GUI + CLI exes
        shell: pwsh
        run: .\packaging\windows\build_exe.ps1 "${{ github.ref_name }}"
      - name: Smoke-test the CLI exe
        # Proves the frozen bundle launches (Python + Qt load) and the lazily
        # imported Windows backends resolve under PyInstaller before it ships.
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .\dist\shotquill\squill.exe --version
          .\dist\shotquill\squill.exe doctor
      - name: Zip the bundle + compute SHA256
        # macOS/Linux ship single-file bundles; the Windows build is a folder of
        # exes + a shared _internal payload, so zip it into one release archive.
        # Sidecar .sha256 in sha256sum-compatible format, like the other bundles.
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          $zip = "dist/ShotQuill-$ver-windows-x64.zip"
          Compress-Archive -Path dist/shotquill/* -DestinationPath $zip
          $h = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$h  $(Split-Path $zip -Leaf)" | Out-File -Encoding ascii -NoNewline "$zip.sha256"
      - name: Add the Windows bundle to the release
        # Pinned to a commit SHA (supply-chain hardening); v3.0.0 (Node 24 runtime).
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          # Keep it a draft; publish-release flips it live once every bundle is in.
          draft: true
          files: |
            dist/ShotQuill-*-windows-x64.zip
            dist/ShotQuill-*-windows-x64.zip.sha256

  # Flip the draft Release live, but only after every platform bundle has been
  # attached. Until this runs the release stays a draft (invisible to users and
  # to "latest release" lookups), so there's never a public release missing its
  # binaries. publish-pypi is intentionally not a dependency: the PyPI package is
  # an independent channel, gated only on `gate` like before.
  publish-release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish the release
        # Pinned to a commit SHA (supply-chain hardening); v3.0.0 (Node 24 runtime).
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          draft: false

  # Update the cask only after the Release is public, so Homebrew never points
  # at assets that are still hidden in a draft.
  update-homebrew:
    needs: [build-macos, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: bash packaging/macos/update_tap.sh "${{ github.ref_name }}" "${{ needs.build-macos.outputs.arm_sha }}" "${{ needs.build-macos.outputs.intel_sha }}"
