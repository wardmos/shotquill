name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: never cut a release from a commit that fails the checks CI runs. A tag
  # can land on any commit, and workflow_dispatch could otherwise bypass a red CI
  # entirely. Split out of the macOS build so the platform builds (which all
  # `needs: gate`) run in parallel instead of chaining behind one another. Kept
  # on macOS so the gate exercises the same OS the .app is built on.
  gate:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c packaging/constraints-release.txt -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Format check (ruff)
        run: ruff format --check src tests
      - name: Test
        run: pytest -q

  # Create the GitHub Release once, so the parallel platform builds each upload
  # their own artifacts to it instead of racing to create it. Generating release
  # notes here keeps that work off the build jobs. Created as a DRAFT so the
  # ~25-min window before the binaries are attached isn't a public, empty
  # release; publish-release flips it live once every bundle is in.
  create-release:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create draft GitHub Release
        # Pinned to a commit SHA (supply-chain hardening); v3.0.0 (Node 24 runtime).
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          draft: true
          generate_release_notes: true

  build-macos:
    # The .app + per-arch DMGs, plus the Homebrew tap bump. Runs in parallel with
    # build-linux now that the gate and the Release shell are their own jobs.
    needs: [gate, create-release]
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # Build deps are pinned so re-running this workflow on the same commit
        # reproduces the same bundle; upgrades go through that file in a PR.
        run: |
          python -m pip install --upgrade pip
          pip install -c packaging/constraints-release.txt -e ".[dev]" pyinstaller
      - name: Record build dependency versions
        run: |
          {
            echo "### Build dependency versions"
            echo '```'
            pip freeze | grep -iE '^(pyinstaller|pyside6|shiboken6|pyobjc)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build .app + DMGs (arm64, x86_64, universal2)
        run: bash packaging/macos/build_dmg.sh "${{ github.ref_name }}"
      - name: Compute SHA256
        id: sha
        run: |
          cd dist
          # Sidecar checksum files (shasum -c compatible) shipped with the release.
          for dmg in ShotQuill-*.dmg; do
            shasum -a 256 "$dmg" > "$dmg.sha256"
          done
          echo "arm_sha=$(awk '{print $1}' ShotQuill-*-arm64.dmg.sha256)" >> "$GITHUB_OUTPUT"
          echo "intel_sha=$(awk '{print $1}' ShotQuill-*-x86_64.dmg.sha256)" >> "$GITHUB_OUTPUT"
      - name: Add DMGs to the release
        # Pinned to a commit SHA (supply-chain hardening); v3.0.0 (Node 24 runtime).
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          # Keep it a draft; publish-release flips it live once every bundle is in.
          draft: true
          files: |
            dist/ShotQuill-*.dmg
            dist/ShotQuill-*.dmg.sha256
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: bash packaging/macos/update_tap.sh "${{ github.ref_name }}" "${{ steps.sha.outputs.arm_sha }}" "${{ steps.sha.outputs.intel_sha }}"

  publish-pypi:
    # `pipx install shotquill` / `pip install shotquill` — the primary channel
    # for the CLI/MCP audience. The package is pure Python (one py3-none-any
    # wheel covers every OS; PySide6 and the macOS-only pyobjc deps resolve at
    # install time), so it builds anywhere; ubuntu is just the cheapest runner.
    needs: gate  # don't publish from a commit the gate rejected
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      # OIDC token for PyPI Trusted Publishing — no API token stored in repo
      # secrets. Configure the trusted publisher once on pypi.org (project
      # shotquill, this repo + workflow `release.yml`, environment `pypi`).
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata renders on PyPI
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - name: Publish to PyPI
        # Pinned to a commit SHA (supply-chain hardening); v1.14.0.
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          # A re-run of the release (same tag/version) shouldn't fail on the
          # immutable PyPI upload that already happened.
          skip-existing: true

  build-linux:
    # Single-file AppImage: the CLI/MCP in a box for users who don't want pip.
    # Built on ubuntu-22.04, so the glibc floor is 2.35 (Ubuntu 22.04+ /
    # Debian 12+) — an older floor needs an older build base (a container).
    # Runs in parallel with build-macos; the Release shell already exists.
    needs: [gate, create-release]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # Same pinned build deps as the macOS bundle, for a reproducible build.
        run: |
          python -m pip install --upgrade pip
          pip install -c packaging/constraints-release.txt -e ".[dev]" pyinstaller
      - name: Build AppImage
        run: bash packaging/linux/build_appimage.sh "${{ github.ref_name }}"
      - name: Install Qt runtime system libraries
        # The AppImage deliberately doesn't bundle the EGL/GL stack (Mesa) —
        # every desktop distro ships it with the graphical session. The bare
        # server runner has no GUI stack at all, so install the same libs
        # ci.yml uses for headless PySide6 before launching the bundle.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxkbcommon0
      - name: Smoke-test the AppImage
        # Proves the bundle launches on a clean runner (Python + Qt load), so a
        # broken bundle fails the release instead of shipping.
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          img=$(echo dist/ShotQuill-*.AppImage)
          chmod +x "$img"
          "$img" --version
          QT_QPA_PLATFORM=offscreen "$img" doctor
      - name: Compute SHA256
        run: |
          cd dist
          for img in ShotQuill-*.AppImage; do
            sha256sum "$img" > "$img.sha256"
          done
      - name: Add AppImage to the release
        # Pinned to a commit SHA (supply-chain hardening); v3.0.0 (Node 24 runtime).
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          # Keep it a draft; publish-release flips it live once every bundle is in.
          draft: true
          files: |
            dist/ShotQuill-*.AppImage
            dist/ShotQuill-*.AppImage.sha256

  # Flip the draft Release live, but only after every platform bundle has been
  # attached. Until this runs the release stays a draft (invisible to users and
  # to "latest release" lookups), so there's never a public release missing its
  # binaries. publish-pypi is intentionally not a dependency: the PyPI package is
  # an independent channel, gated only on `gate` like before.
  publish-release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish the release
        # Pinned to a commit SHA (supply-chain hardening); v3.0.0 (Node 24 runtime).
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          draft: false
