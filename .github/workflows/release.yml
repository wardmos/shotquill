name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - name: Build .app + DMG
        run: bash packaging/macos/build_dmg.sh "${{ github.ref_name }}"
      - name: Compute SHA256
        id: sha
        run: echo "sha=$(shasum -a 256 dist/Shotquill-*.dmg | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        # Pinned to a commit SHA (supply-chain hardening); v2.6.2.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: dist/Shotquill-*.dmg
          generate_release_notes: true
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: bash packaging/macos/update_tap.sh "${{ github.ref_name }}" "${{ steps.sha.outputs.sha }}"
