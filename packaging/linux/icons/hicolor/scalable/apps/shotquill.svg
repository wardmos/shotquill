<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  ShotQuill Linux application icon.

  Matches the app icon: a blue rounded tile with a white capture/pen mark.
  Vector so it scales to every panel/launcher size the desktop asks for.
  freedesktop-spec path: install to share/icons/hicolor/scalable/apps/shotquill.svg

  SPDX-License-Identifier: Apache-2.0
  Copyright (C) 2026 wardmos
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256"
     width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="34" y1="34" x2="222" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b96ff"/>
      <stop offset="1" stop-color="#005fe8"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="208" height="208" rx="52" ry="52" fill="url(#tile)"/>

  <g fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M81 76H105"/>
    <path d="M81 76Q67 76 67 91V112"/>
    <path d="M175 76H151"/>
    <path d="M175 76Q189 76 189 91V112"/>
    <path d="M81 180H105"/>
    <path d="M81 180Q67 180 67 165V144"/>
    <path d="M175 180H151"/>
    <path d="M175 180Q189 180 189 165V144"/>
  </g>

  <path fill="#ffffff"
        d="M112 182C108 158 101 144 91 132C101 100 124 82 163 73C158 100 141 116 116 126C130 126 145 123 156 118C147 135 146 151 154 166C142 176 136 182 132 182Z"/>
  <rect x="115" y="178" width="28" height="10" rx="2" fill="#ffffff"/>
  <circle cx="128" cy="139" r="7" fill="#087cf3"/>
  <rect x="125" y="146" width="6" height="35" fill="#087cf3"/>
</svg>
